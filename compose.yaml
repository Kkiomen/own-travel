name: travel

# Only `app` publishes a port. Postgres and Redis have no host binding at all;
# Adminer and Mailpit bind to 127.0.0.1 so they are reachable from the VPS
# itself (or over an SSH tunnel) but never from the internet.

x-app: &app
  image: travel/app:latest
  restart: unless-stopped
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - storage:/var/www/html/storage
  networks:
    - edge
    - backend

services:
  app:
    <<: *app
    build:
      context: .
      target: runtime
    environment:
      CONTAINER_ROLE: app
    ports:
      - "${APP_PORT:-8000}:80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Scrapers and notifications run here.
  worker:
    <<: *app
    environment:
      CONTAINER_ROLE: worker
    command: php artisan queue:work --queue=high,default --sleep=1 --tries=3 --backoff=30 --max-time=3600 --max-jobs=500
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Fires the scheduled deal scans.
  scheduler:
    <<: *app
    environment:
      CONTAINER_ROLE: scheduler
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-travel}
      POSTGRES_USER: ${DB_USERNAME:-travel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-travel} -d ${DB_DATABASE:-travel}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  # Tunnel-only tooling: ssh -L 8080:127.0.0.1:8080 user@vps
  adminer:
    image: adminer:5
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8091}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge
      - backend

  # Catches outgoing deal alerts during development.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks:
      - edge
      - backend

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redisdata:
  storage:
